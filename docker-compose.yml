services:
  db:
    image: postgres:17
    container_name: cloudvault-db
    environment:
      POSTGRES_DB: cloudvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: cloudvault-backend:latest
    container_name: cloudvault-backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/cloudvault
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: